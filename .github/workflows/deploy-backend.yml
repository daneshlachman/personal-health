name: Deploy Backend

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  # GitHub Container Registry (free) instead of Azure Container Registry (~€4.30/month).
  # The Container App pulls with a read:packages token stored as its registry secret.
  IMAGE: ghcr.io/daneshlachman/health-dashboard-backend
  API_KEY: ${{ secrets.API_KEY }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The app's API key comes from the GitHub secret API_KEY. Without it the app stays
      # open (the backend skips the check when API_KEY is unset).
      - name: Set API key secret
        if: env.API_KEY != ''
        run: |
          az containerapp secret set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --secrets "api-key=$API_KEY" \
            --output none

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            ${API_KEY:+--set-env-vars API_KEY=secretref:api-key} \
            --output none
